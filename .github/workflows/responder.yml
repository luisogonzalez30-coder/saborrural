name: Responder en Instagram

on:
  schedule:
    # Cada 15 min entre las 08:00 y las 23:45 de Chile (cubre horario de verano UTC-3 y de invierno UTC-4)
    - cron: '4,19,34,49 11-23,0-2 * * *'
  workflow_dispatch:
    inputs:
      ensayo:
        description: 'Ensayo: muestra qué respondería, sin enviar nada'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: responder
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LISTO: ${{ secrets.ANTHROPIC_API_KEY != '' && secrets.IG_PAGE_TOKEN != '' }}   # sin las claves, no hace nada (ni falla)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: env.LISTO == 'true'
        run: npm install --no-audit --no-fund
      - name: Responder comentarios y mensajes
        if: env.LISTO == 'true'
        run: node responder.mjs
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GRAPH_BASE: ${{ vars.GRAPH_BASE }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.ensayo) && '1' || '' }}
      - name: Guardar estado
        if: always() && env.LISTO == 'true'
        run: |
          git config user.name "asistente-instagram"
          git config user.email "asistente@users.noreply.github.com"
          [ -f estado-respuestas.json ] && git add estado-respuestas.json || true
          git diff --cached --quiet || (git commit -m "estado: respuestas" && git pull --rebase -q && git push)
